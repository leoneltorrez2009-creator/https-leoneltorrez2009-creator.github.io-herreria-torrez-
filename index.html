<style>

*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:104px}

/* Cabecera */
.top{position:sticky;top:0;z-index:20;background:rgba(242,245,239,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--sage)}

.g{display:grid;grid-template-columns:repeat(2,1fr);gap:1.4rem .8rem}
@media(min-width:700px){.g{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.75rem 1.1rem}}
.card{display:flex;flex-direction:column}

button.pic{cursor:zoom-in}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.pic-empty{width:40%;height:40%;opacity:.5}
.nm{margin-top:.6rem;font-weight:700;line-height:1.25}
dl{margin-top:.6rem;border-top:2px solid var(--deep)}
dl div{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding:.4rem 0;border-bottom:1px solid var(--sage)}
dt{font-size:.8rem;color:var(--mute)}
dd{font-weight:800;color:var(--deep)}

/* Producción */
.prod{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:1.5rem;padding-bottom:3rem}
.post .pic{aspect-ratio:16/10;border-radius:14px}
.post h3{margin-top:.9rem;font-size:1.4rem;line-height:1.2;color:var(--deep)}
.post p{color:var(--mute)}

/* Botón flotante móvil */
.wa-float{position:fixed;bottom:1.5rem;right:1.5rem;z-index:10;display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#25d366;color:#08331b;box-shadow:0 4px 16px rgba(0,0,0,.24)}
.wa-float svg{width:30px;height:30px}

/* Pie */
footer{background:var(--deep);color:#d9e6dc}
.ft{max-width:1200px;margin:auto;padding:1.75rem 1rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.9rem 2rem}
.ft b{font-weight:800;font-size:1.2rem;color:#fff}
.ft a{display:inline-flex;align-items:center;gap:.5rem}
.ft a:hover{color:#fff;text-decoration:underline}

/* Visor de imágenes */
dialog{inset:0;margin:0;border:0;padding:0;width:100%;height:100%;max-width:none;max-height:none;overflow:hidden;background:rgba(8,14,10,.96);color:#fff}
dialog::backdrop{background:rgba(8,14,10,.96)}
dialog[open]{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}dialog[open]{animation:none}}
.stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;touch-action:none}
.stage img{max-width:100vw;max-height:100dvh;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none}
.lbtn{position:absolute;z-index:2;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);font-size:1.6rem;line-height:1;color:#fff}
.lbtn:hover{background:rgba(255,255,255,.28)}
#x{top:max(.75rem,env(safe-area-inset-top));right:.75rem}
.zb{position:absolute;z-index:2;bottom:max(1rem,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:.6rem}
.zb .lbtn{position:static}
</style>

<script>
const P=(nombre="",img="",mayor="",menor="")=>({nombre,img,mayor,menor});

const CATALOGO=[
  {id:"cactus",titulo:"Cactus y suculentas",items:[P(),P(),P(),P()]},
  {id:"rosales",titulo:"Rosales",sub:[
    {t:"De pie",items:[P(),P(),P(),P()]},
    {t:"Trepadoras",items:[P(),P(),P(),P()]},
    {t:"Enredaderas",items:[P(),P(),P(),P()]}
  ]},
  {id:"interior",titulo:"Plantas de interior",items:[P(),P(),P(),P()]},
  {id:"colgantes",titulo:"Colgantes",items:[P(),P(),P(),P()]},
  {id:"arboles",titulo:"Árboles y frutales",items:[P(),P(),P(),P()]},
  {id:"tierra",titulo:"Tierra preparada",items:[P(),P(),P(),P()]},
  {id:"macetas",titulo:"Macetas de barro",items:[P(),P(),P(),P()]},
  {id:"flores",titulo:"Flores",items:[P(),P(),P(),P()]},
  {id:"plantines",titulo:"Plantines de estación",items:[P(),P(),P(),P()]},
  {id:"portamacetas",titulo:"Porta macetas",items:[P(),P(),P(),P()]}
];

const PRODUCCION=[
  {titulo:"Árboles",img:""},
  {titulo:"Rosales",img:""}
];

/* ============ RENDER ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=v=>v===""?"—":typeof v==="number"?"$ "+v.toLocaleString("es-AR"):esc(v);

const placeholder=`<svg class="pic-empty" viewBox="0 0 120 200"><use href="#sag"/></svg>`;

const pic=(src,alt)=>src
  ?`<button class="pic" type="button" data-zoom="${esc(src)}" data-alt="${esc(alt)}" aria-label="Ampliar imagen de ${esc(alt)}"><img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" decoding="async"></button>`
  :`<div class="pic" aria-hidden="true">${placeholder}</div>`;

const card=p=>`<article class="card">${pic(p.img,p.nombre)}${p.nombre?`<p class="nm">${esc(p.nombre)}</p>`:""}<dl><div><dt>Por mayor</dt><dd>${money(p.mayor)}</dd></div><div><dt>Por menor</dt><dd>${money(p.menor)}</dd></div></dl></article>`;
const grid=a=>`<div class="g">${a.map(card).join("")}</div>`;

$("catalogo").innerHTML=
  CATALOGO.map(s=>`<section id="${s.id}"><h2>${s.titulo}</h2>${s.sub?s.sub.map(g=>`<h3 class="sub">${g.t}</h3>${grid(g.items)}`).join(""):grid(s.items)}</section>`).join("")
  +`<section id="produccion"><h2>Nuestra producción</h2><div class="prod">${PRODUCCION.map(p=>`<article class="post">${pic(p.img,p.titulo)}<h3>${p.titulo}</h3><p>En lagares</p></article>`).join("")}</div></section>`;

$("menu").innerHTML=[...CATALOGO.map(s=>[s.id,s.titulo]),["produccion","Nuestra producción"]]
  .map(([id,t])=>`<a href="#${id}">${t}</a>`).join("");

/* ============ VISOR CON ZOOM ============ */
const lb=$("lb"),st=lb.querySelector(".stage"),im=st.firstElementChild,pt=new Map();
let s=1,x=0,y=0,d0=0,mv=0,tap=0,down=null;

const resetZoom=()=>{s=1;x=0;y=0;pt.clear();view();};

const view=()=>{
  if(s<=1){s=1;x=0;y=0}
  const mx=im.offsetWidth*(s-1)/2,my=im.offsetHeight*(s-1)/2;
  x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y));
  im.style.transform=`translate(${x}px,${y}px) scale(${s})`;
  im.style.cursor=s>1?"grab":"zoom-in";
};
const zoom=k=>{s=Math.min(5,s*k);view()};
const dist=()=>{const[a,b]=[...pt.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])};

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-zoom]");
  if(!b)return;
  im.src=b.dataset.zoom;im.alt=b.dataset.alt;resetZoom();lb.showModal();
});

st.onpointerdown=e=>{
  down=e.target;st.setPointerCapture(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);
  if(pt.size===1)mv=0;else d0=dist();
};
st.onpointermove=e=>{
  const p=pt.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p[0],dy=e.clientY-p[1];
  pt.set(e.pointerId,[e.clientX,e.clientY]);mv+=Math.abs(dx)+Math.abs(dy);
  if(pt.size===2){const d=dist();if(d0)s=Math.min(5,Math.max(1,s*d/d0));d0=d;view()}
  else if(s>1){x+=dx;y+=dy;view()}
};
st.onpointerup=e=>{
  if(st.hasPointerCapture(e.pointerId)) st.releasePointerCapture(e.pointerId);
  pt.delete(e.pointerId);
  if(pt.size||mv>8)return;
  const t=Date.now();
  if(t-tap<300){tap=0;if(s>1){s=1;view()}else zoom(2.5)}
  else{tap=t;if(down===st)lb.close()}
};
st.onpointercancel=e=>{
  if(st.hasPointerCapture(e.pointerId)) st.releasePointerCapture(e.pointerId);
  pt.delete(e.pointerId);
};
st.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY<0?1.2:1/1.2)},{passive:false});

lb.addEventListener("close", resetZoom);
$("x").onclick=()=>lb.close();
lb.querySelector(".zb").onclick=e=>{const b=e.target.closest("button");if(b)zoom(b.dataset.k>0?1.5:1/1.5)};
</script>
